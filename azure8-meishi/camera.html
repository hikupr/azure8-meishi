<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名刺撮影 - Azure8</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: rgba(44, 62, 80, 0.9);
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }

    .close-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      padding: 8px;
    }

    .header-title {
      font-size: 18px;
      font-weight: bold;
      flex: 1;
      text-align: center;
      margin-right: 40px;
    }

    .camera-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-top: 60px;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    #video.active {
      display: block;
    }

    .guide-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      max-width: 400px;
      height: 55%;
      max-height: 250px;
      border: 3px dashed rgba(255, 255, 255, 0.8);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
      pointer-events: none;
      z-index: 10;
    }

    .guide-text {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      color: white;
      font-size: 14px;
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 12px 24px;
      border-radius: 8px;
      z-index: 10;
    }

    .controls {
      position: fixed;
      bottom: 30px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .capture-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: white;
      border: 5px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    .capture-btn:active {
      transform: scale(0.95);
    }

    .capture-btn-inner {
      width: 90%;
      height: 90%;
      border-radius: 50%;
      background: white;
    }

    .loading {
      text-align: center;
      color: white;
      padding: 40px 20px;
    }

    .loading-spinner {
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      text-align: center;
      color: white;
      padding: 40px 20px;
    }

    .error-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }

    .retry-btn {
      margin-top: 20px;
      padding: 12px 24px;
      background: white;
      color: #2C3E50;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="close-btn" onclick="goBack()">✕</button>
    <div class="header-title">名刺撮影</div>
    <div style="width: 40px;"></div>
  </div>

  <div class="camera-container">
    <video id="video" playsinline autoplay></video>
    <div class="guide-frame"></div>
    <div class="guide-text">名刺を枠に合わせてください</div>
    
    <div id="loading" class="loading" style="display: none;">
      <div class="loading-spinner"></div>
      <div>カメラを起動中...</div>
    </div>

    <div id="error" class="error" style="display: none;">
      <div class="error-icon">⚠️</div>
      <div id="errorMessage">カメラにアクセスできませんでした</div>
      <button class="retry-btn" onclick="startCamera()">再試行</button>
      <button class="retry-btn" onclick="location.href='register.html'" style="margin-left: 10px;">手動入力に進む</button>
    </div>
  </div>

  <div class="controls" id="controls" style="display: none;">
    <button class="capture-btn" id="captureBtn" onclick="capturePhoto()">
      <div class="capture-btn-inner"></div>
    </button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const controls = document.getElementById('controls');
    const captureBtn = document.getElementById('captureBtn');
    const errorMessage = document.getElementById('errorMessage');

    let stream = null;

    // ページ読み込み時にカメラ起動
    window.addEventListener('DOMContentLoaded', () => {
      console.log('ページ読み込み完了');
      startCamera();
    });

    // カメラ起動
    async function startCamera() {
      console.log('カメラ起動開始');
      loading.style.display = 'block';
      error.style.display = 'none';
      
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        });
        
        console.log('カメラストリーム取得成功');
        video.srcObject = stream;
        video.classList.add('active');
        loading.style.display = 'none';
        controls.style.display = 'flex';
        console.log('撮影ボタン表示');
        
      } catch (err) {
        console.error('カメラエラー:', err);
        loading.style.display = 'none';
        error.style.display = 'block';
        
        if (err.name === 'NotAllowedError') {
          errorMessage.textContent = 'カメラの使用が許可されていません。ブラウザの設定を確認してください。';
        } else if (err.name === 'NotFoundError') {
          errorMessage.textContent = 'カメラが見つかりませんでした。';
        } else {
          errorMessage.textContent = 'カメラにアクセスできませんでした。';
        }
      }
    }
