<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azure8 名刺管理</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F8F9FA;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      flex: 1;
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
      width: 100%;
    }

    .header {
      text-align: center;
      margin-bottom: 60px;
    }

    .header h1 {
      color: #2C3E50;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .header p {
      color: #7F8C8D;
      font-size: 14px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .btn {
      background: #2C3E50;
      color: white;
      padding: 20px;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      box-shadow: 0 4px 12px rgba(44, 62, 80, 0.2);
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover {
      background: #34495E;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(44, 62, 80, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-icon {
      font-size: 24px;
    }

    .footer {
      background: #2C3E50;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: auto;
    }

    .footer-logo {
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .footer-text {
      font-size: 12px;
      color: #BDC3C7;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Azure8 名刺管理</h1>
      <p>名刺をスマートに管理</p>
    </div>

    <div class="button-group">
      <a href="select-method.html" class="btn">
        <span class="btn-icon">📝</span>
        <span>登録</span>
      </a>
      
      <a href="list.html" class="btn">
        <span class="btn-icon">📋</span>
        <span>一覧</span>
      </a>
    </div>
  </div>

  <div class="footer">
    <div class="footer-logo">AZURE8</div>
    <div class="footer-text">Business Card Management</div>
  </div>
</body>
</html>
