<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登録方法選択 - Azure8</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #F8F9FA;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #2C3E50;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
    }

    .header-title {
      font-size: 18px;
      font-weight: bold;
    }

    .container {
      flex: 1;
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
      width: 100%;
    }

    .title {
      text-align: center;
      color: #2C3E50;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 40px;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .method-btn {
      background: white;
      border: 2px solid #DEE2E6;
      border-radius: 12px;
      padding: 30px 20px;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .method-btn:hover {
      border-color: #2C3E50;
      transform: translateY(-4px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
    }

    .method-icon {
      font-size: 48px;
    }

    .method-title {
      font-size: 18px;
      font-weight: bold;
      color: #2C3E50;
    }

    .method-desc {
      font-size: 14px;
      color: #7F8C8D;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <button class="back-btn" onclick="location.href='index.html'">←</button>
    <div class="header-title">登録方法選択</div>
  </div>

  <div class="container">
    <div class="title">名刺の登録方法を選択してください</div>

    <div class="button-group">
      <a href="register.html" class="method-btn">
        <div class="method-icon">✏️</div>
        <div class="method-title">手動入力</div>
        <div class="method-desc">フォームに直接入力して登録</div>
      </a>

      <a href="camera.html" class="method-btn">
        <div class="method-icon">📷</div>
        <div class="method-title">撮影して登録</div>
        <div class="method-desc">名刺を撮影して登録（準備中）</div>
      </a>
    </div>
  </div>
</body>
</html>
